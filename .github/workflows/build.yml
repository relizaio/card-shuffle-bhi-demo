on:
  push:
    branches: [main]    # post-merge commits to main only
  pull_request:         # everything in feature branches goes through PR event

name: Build Card Shuffle BHI Demo Components And Submit Metadata To ReARM CE

# Components are pre-created on rearmce.rearmhq.com under the product
# "Card Shuffle BlackHat India Demo" (Base Feature Set auto-integrates on
# ^card-shuffle-bhi.*). Each job pins its component uuid so the org-wide key
# never auto-creates duplicates.

env:
  REARM_API_URL: https://rearmce.rearmhq.com
  REGISTRY_HOST: registry.relizahub.com
  REGISTRY_NAMESPACE: registry.relizahub.com/daa4168b-a05c-4880-a105-ddd5e3821b1a-public

jobs:
  build-mafia-vue:
    permissions:
      contents: read
      id-token: write
    name: Build And Push card-shuffle-bhi-demo-vue
    runs-on: ubuntu-latest
    steps:
      - name: Build And Push card-shuffle-bhi-demo-vue to ReARM CE
        uses: relizaio/rearm-docker-action@975e8b3d96b53d56d9c21a34b927b6d7b2a52720 # 1.13.4
        with:
          registry_username: ${{ secrets.DOCKER_LOGIN }}
          registry_password: ${{ secrets.DOCKER_TOKEN }}
          registry_host: ${{ env.REGISTRY_HOST }}
          image_namespace: ${{ env.REGISTRY_NAMESPACE }}
          image_name: card-shuffle-bhi-demo-vue
          rearm_api_id: ${{ secrets.REARM_API_ID }}
          rearm_api_key: ${{ secrets.REARM_API_KEY }}
          rearm_api_url: ${{ env.REARM_API_URL }}
          rearm_component_id: 8287c6da-0e55-4932-8e1a-74af4ac904ed
          path: mafia-vue
          enable_sbom: true
          source_code_sbom_type: npm
  build-mafia-express:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    name: Build And Push card-shuffle-bhi-demo-express
    runs-on: ubuntu-latest
    steps:
      - name: Build And Push card-shuffle-bhi-demo-express to ReARM CE
        uses: relizaio/rearm-docker-action@975e8b3d96b53d56d9c21a34b927b6d7b2a52720 # 1.13.4
        with:
          registry_username: ${{ secrets.DOCKER_LOGIN }}
          registry_password: ${{ secrets.DOCKER_TOKEN }}
          registry_host: ${{ env.REGISTRY_HOST }}
          image_namespace: ${{ env.REGISTRY_NAMESPACE }}
          image_name: card-shuffle-bhi-demo-express
          rearm_api_id: ${{ secrets.REARM_API_ID }}
          rearm_api_key: ${{ secrets.REARM_API_KEY }}
          rearm_api_url: ${{ env.REARM_API_URL }}
          rearm_component_id: d86aea98-c061-4ba2-b3d6-2600d037b605
          path: mafia-express
          enable_sbom: true
          source_code_sbom_type: npm
  build-mafia-helm:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    name: Build And Push card-shuffle-bhi-demo-helm
    runs-on: ubuntu-latest
    steps:
      - name: Build mafia Helm Chart and push to ReARM CE
        uses: relizaio/rearm-helm-action@9261ed4cd8235eeae69d75589f17ebcb5fe457b5 # 1.10.2
        with:
          registry_username: ${{ secrets.DOCKER_LOGIN }}
          registry_password: ${{ secrets.DOCKER_TOKEN }}
          registry_host: ${{ env.REGISTRY_NAMESPACE }}
          helm_chart_name: mafia
          rearm_api_id: ${{ secrets.REARM_API_ID }}
          rearm_api_key: ${{ secrets.REARM_API_KEY }}
          rearm_api_url: ${{ env.REARM_API_URL }}
          rearm_component_id: f319eaee-aafc-4904-b99d-cbaff6f29f36
          enable_sbom: true
          path: mafia-helm
          limit_to_branches: main
